<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <rect width="500" height="300" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    DITA to EPUB Workflow
  </text>

  <!-- DITA Source box -->
  <rect x="30" y="60" width="120" height="60" rx="6" fill="#4a90d9" stroke="#3a7bc8" stroke-width="1.5"/>
  <text x="90" y="95" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13">DITA Source</text>

  <!-- Arrow 1 -->
  <line x1="150" y1="90" x2="180" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- XSLT Transform box -->
  <rect x="180" y="60" width="120" height="60" rx="6" fill="#e8a838" stroke="#d09730" stroke-width="1.5"/>
  <text x="240" y="88" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13">XSLT</text>
  <text x="240" y="103" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13">Transform</text>

  <!-- Arrow 2 -->
  <line x1="300" y1="90" x2="330" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- EPUB Output box -->
  <rect x="330" y="60" width="120" height="60" rx="6" fill="#5cb85c" stroke="#4cae4c" stroke-width="1.5"/>
  <text x="390" y="95" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13">EPUB 3</text>

  <!-- Sub-components -->
  <rect x="30" y="160" width="90" height="45" rx="4" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  <text x="75" y="186" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="11">Topics</text>

  <rect x="135" y="160" width="90" height="45" rx="4" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  <text x="180" y="186" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="11">Bookmap</text>

  <rect x="240" y="160" width="90" height="45" rx="4" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  <text x="285" y="186" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="11">Images</text>

  <rect x="345" y="160" width="90" height="45" rx="4" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  <text x="390" y="186" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="11">Metadata</text>

  <!-- Output components -->
  <rect x="80" y="230" width="90" height="45" rx="4" fill="#d4edda" stroke="#c3e6cb" stroke-width="1"/>
  <text x="125" y="256" text-anchor="middle" fill="#155724" font-family="Arial, sans-serif" font-size="11">XHTML</text>

  <rect x="195" y="230" width="90" height="45" rx="4" fill="#d4edda" stroke="#c3e6cb" stroke-width="1"/>
  <text x="240" y="256" text-anchor="middle" fill="#155724" font-family="Arial, sans-serif" font-size="11">OPF</text>

  <rect x="310" y="230" width="90" height="45" rx="4" fill="#d4edda" stroke="#c3e6cb" stroke-width="1"/>
  <text x="355" y="256" text-anchor="middle" fill="#155724" font-family="Arial, sans-serif" font-size="11">Navigation</text>


</svg>
