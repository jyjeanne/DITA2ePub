<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>
  <rect width="500" height="200" fill="#fafafa" rx="6"/>

  <text x="250" y="24" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Font Embedding Pipeline</text>

  <!-- Step 1 -->
  <rect x="15" y="50" width="100" height="55" rx="5" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="65" y="72" text-anchor="middle" fill="#1565c0" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Discover</text>
  <text x="65" y="88" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="9">.ttf .otf</text>
  <text x="65" y="100" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="9">.woff .woff2</text>

  <line x1="115" y1="77" x2="140" y2="77" stroke="#666" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Step 2 -->
  <rect x="140" y="50" width="100" height="55" rx="5" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="190" y="72" text-anchor="middle" fill="#e65100" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Detect</text>
  <text x="190" y="88" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="9">family, weight</text>
  <text x="190" y="100" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="9">style from name</text>

  <line x1="240" y1="77" x2="265" y2="77" stroke="#666" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Step 3 -->
  <rect x="265" y="50" width="100" height="55" rx="5" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="315" y="72" text-anchor="middle" fill="#2e7d32" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Generate</text>
  <text x="315" y="88" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="9">@font-face CSS</text>
  <text x="315" y="100" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="9">OPF manifest</text>

  <line x1="365" y1="77" x2="390" y2="77" stroke="#666" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Step 4 -->
  <rect x="390" y="50" width="95" height="55" rx="5" fill="#fce4ec" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="437" y="72" text-anchor="middle" fill="#c62828" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Obfuscate</text>
  <text x="437" y="88" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="9">IDPF XOR</text>
  <text x="437" y="100" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="9">encryption.xml</text>

  <!-- Output row -->
  <rect x="15" y="130" width="470" height="45" rx="5" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1"/>
  <text x="250" y="150" text-anchor="middle" fill="#6a1b9a" font-family="Arial, sans-serif" font-size="12" font-weight="bold">EPUB Package</text>
  <text x="250" y="166" text-anchor="middle" fill="#555" font-family="Arial, sans-serif" font-size="10">fonts/ (obfuscated)  +  styles/epub-fonts.css  +  META-INF/encryption.xml</text>
</svg>
