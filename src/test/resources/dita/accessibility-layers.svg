<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="460" height="320" viewBox="0 0 460 320">
  <rect width="460" height="320" fill="#fafafa" rx="6"/>

  <text x="230" y="28" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="15" font-weight="bold">EPUB Accessibility Layers</text>

  <!-- Layer 4 (outermost) -->
  <rect x="20" y="45" width="420" height="255" rx="8" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1.5"/>
  <text x="230" y="68" text-anchor="middle" fill="#283593" font-family="Arial, sans-serif" font-size="13" font-weight="bold">WCAG Conformance (A / AA / AAA)</text>

  <!-- Layer 3 -->
  <rect x="40" y="80" width="380" height="205" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="230" y="100" text-anchor="middle" fill="#1565c0" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Navigation &amp; Structure</text>

  <!-- Layer 2 -->
  <rect x="60" y="112" width="340" height="160" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="230" y="132" text-anchor="middle" fill="#2e7d32" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Semantic Markup</text>

  <!-- Layer 1 (innermost) -->
  <rect x="80" y="144" width="300" height="115" rx="6" fill="#fff8e1" stroke="#ffe082" stroke-width="1.5"/>
  <text x="230" y="164" text-anchor="middle" fill="#f57f17" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Content Alternatives</text>

  <!-- Inner items -->
  <text x="130" y="188" fill="#555" font-family="Arial, sans-serif" font-size="11">Alt text for images</text>
  <text x="130" y="206" fill="#555" font-family="Arial, sans-serif" font-size="11">Extended descriptions</text>
  <text x="130" y="224" fill="#555" font-family="Arial, sans-serif" font-size="11">Table headers</text>
  <text x="130" y="242" fill="#555" font-family="Arial, sans-serif" font-size="11">Language attributes</text>

  <text x="300" y="188" fill="#555" font-family="Arial, sans-serif" font-size="11">ARIA roles</text>
  <text x="300" y="206" fill="#555" font-family="Arial, sans-serif" font-size="11">epub:type</text>
  <text x="300" y="224" fill="#555" font-family="Arial, sans-serif" font-size="11">Heading hierarchy</text>
  <text x="300" y="242" fill="#555" font-family="Arial, sans-serif" font-size="11">Landmarks</text>

  <!-- Legend -->
  <text x="230" y="310" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="10" font-style="italic">Each layer builds upon the one below to create a fully accessible publication</text>
</svg>
