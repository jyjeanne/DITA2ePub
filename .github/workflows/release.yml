name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.1
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.1)'
        required: true
        type: string

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download DITA-OT
        run: |
          wget -q https://github.com/dita-ot/dita-ot/releases/download/4.3.5/dita-ot-4.3.5.zip
          unzip -q dita-ot-4.3.5.zip
          echo "DITA_HOME=${{ github.workspace }}/dita-ot-4.3.5" >> $GITHUB_ENV

      - name: Build and test
        run: |
          ./gradlew clean build test --no-daemon

      - name: Install plugin and validate
        run: |
          cp -r . "$DITA_HOME/plugins/io.github.jyjeanne.dita2epub"
          cd "$DITA_HOME"
          ./bin/dita install

          # Test EPUB generation
          ./bin/dita --input="${{ github.workspace }}/src/test/resources/dita/sample-bookmap.ditamap" \
                     --format=epub3 \
                     --output="${{ github.workspace }}/build/release-test"

      - name: Verify EPUB
        run: |
          if ls build/release-test/*.epub 1> /dev/null 2>&1; then
            echo "✅ Release validation successful"
          else
            echo "❌ Release validation failed"
            exit 1
          fi

  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build release
        run: ./gradlew clean build -x test --no-daemon

      - name: Create plugin ZIP
        run: |
          mkdir -p dist
          zip -r "dist/dita2epub-${{ steps.get_version.outputs.VERSION }}.zip" \
            plugin.xml \
            build-epub3.xml \
            src/main/xsl \
            src/main/resources \
            src/main/java \
            README.md \
            SPECIFICATION.md \
            QUICKSTART.md \
            RELEASE_NOTES.md \
            CONTRIBUTING.md \
            LICENSE

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.get_version.outputs.VERSION }}
          path: dist/
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ steps.get_version.outputs.VERSION }}
          path: dist/

      - name: Extract release notes
        id: release_notes
        run: |
          # Extract version section from RELEASE_NOTES.md
          sed -n '/## Version ${{ steps.get_version.outputs.VERSION }}/,/## Version/p' RELEASE_NOTES.md | head -n -1 > release_body.md

          # If empty, use a default message
          if [ ! -s release_body.md ]; then
            echo "Release ${{ steps.get_version.outputs.VERSION }}" > release_body.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body_path: release_body.md
          files: |
            dist/*.zip
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-plugin:
    name: Publish to DITA-OT Registry
    runs-on: ubuntu-latest
    needs: create-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Notify about manual publication
        run: |
          echo "## 📦 Plugin Ready for Publication" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the plugin ZIP from the release assets" >> $GITHUB_STEP_SUMMARY
          echo "2. Test the plugin with DITA-OT 4.3.5" >> $GITHUB_STEP_SUMMARY
          echo "3. Submit to DITA-OT plugin registry (if applicable)" >> $GITHUB_STEP_SUMMARY
          echo "4. Update project documentation with release information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
