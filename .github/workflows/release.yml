name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.0)'
        required: true
        type: string

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build, test, and package
        run: ./gradlew clean compileJava test distChecksum --no-daemon

      - name: Check the registry entry of this version
        run: |
          DIST_ZIP=$(ls build/dist/io.github.jyjeanne.dita2epub-*.zip | head -1)
          VERSION=$(basename "$DIST_ZIP" .zip | sed 's/io.github.jyjeanne.dita2epub-//')
          node .github/scripts/registry-entry.js "$VERSION" "$DIST_ZIP" "check" "$RUNNER_TEMP/registry-entry.json" > /dev/null

      - name: Install plugin in DITA-OT and test
        run: |
          wget -q https://github.com/dita-ot/dita-ot/releases/download/4.4.1/dita-ot-4.4.1.zip
          unzip -q dita-ot-4.4.1.zip

          # Find the actual dist ZIP produced by Gradle (avoids version mismatch with git tag)
          DIST_ZIP=$(ls build/dist/io.github.jyjeanne.dita2epub-*.zip | head -1)
          if [ -z "$DIST_ZIP" ]; then
            echo "No distribution ZIP found in build/dist/"
            exit 1
          fi
          echo "Installing plugin from: $DIST_ZIP"

          # Install plugin from the distribution ZIP
          ./dita-ot-4.4.1/bin/dita install "$DIST_ZIP"

          # Test EPUB generation
          ./dita-ot-4.4.1/bin/dita \
            --input="src/test/resources/dita/sample-bookmap.ditamap" \
            --format=epub3 \
            --output="build/release-test"

          # Verify EPUB was generated
          if ls build/release-test/*.epub 1> /dev/null 2>&1; then
            echo "Release validation successful"
          else
            echo "Release validation failed — no EPUB generated"
            exit 1
          fi

  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build distribution ZIP with checksum
        run: ./gradlew clean distChecksum --no-daemon

      - name: Detect version from built artifact
        id: get_version
        run: |
          DIST_ZIP=$(ls build/dist/io.github.jyjeanne.dita2epub-*.zip | grep -v '.SHA-256' | head -1)
          FILENAME=$(basename "$DIST_ZIP")
          # Extract version: io.github.jyjeanne.dita2epub-1.2.0.zip -> 1.2.0
          VERSION=$(echo "$FILENAME" | sed 's/io.github.jyjeanne.dita2epub-//' | sed 's/.zip//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Display checksum
        run: cat build/dist/*.SHA-256

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.get_version.outputs.VERSION }}
          path: build/dist/io.github.jyjeanne.dita2epub-*
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ steps.get_version.outputs.VERSION }}
          path: dist/

      - name: Generate the DITA-OT registry entry
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          node .github/scripts/registry-entry.js "$VERSION" \
            "dist/io.github.jyjeanne.dita2epub-${VERSION}.zip" \
            "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/io.github.jyjeanne.dita2epub-${VERSION}.zip" \
            dist/io.github.jyjeanne.dita2epub.json

      - name: Extract release notes from CHANGELOG
        id: release_notes
        run: |
          # Extract version section from CHANGELOG.md
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          sed -n "/## \[${VERSION}\]/,/## \[/p" docs/CHANGELOG.md | head -n -1 > release_body.md

          if [ ! -s release_body.md ]; then
            echo "Release v${VERSION}" > release_body.md
          fi

          # Append install instructions
          echo "" >> release_body.md
          echo "## Installation" >> release_body.md
          echo "" >> release_body.md
          echo "Install via DITA-OT (once published to registry):" >> release_body.md
          echo '```bash' >> release_body.md
          echo "dita install io.github.jyjeanne.dita2epub" >> release_body.md
          echo '```' >> release_body.md
          echo "" >> release_body.md
          echo "Or install directly from this release:" >> release_body.md
          echo '```bash' >> release_body.md
          echo "dita install https://github.com/jyjeanne/dita2epub/releases/download/v${VERSION}/io.github.jyjeanne.dita2epub-${VERSION}.zip" >> release_body.md
          echo '```' >> release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body_path: release_body.md
          files: |
            dist/io.github.jyjeanne.dita2epub-${{ steps.get_version.outputs.VERSION }}.zip
            dist/io.github.jyjeanne.dita2epub-${{ steps.get_version.outputs.VERSION }}.zip.SHA-256
            dist/io.github.jyjeanne.dita2epub.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Registry submission reminder
        run: |
          echo "## Plugin Released" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next: Submit to DITA-OT Registry" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Registry entry of this release (also attached to the release as \`io.github.jyjeanne.dita2epub.json\`):" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat dist/io.github.jyjeanne.dita2epub.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Copy its \`cksum\` into \`io.github.jyjeanne.dita2epub.json\` of this repository" >> $GITHUB_STEP_SUMMARY
          echo "2. Add the entry to \`io.github.jyjeanne.dita2epub.json\` in a fork of [dita-ot/registry](https://github.com/dita-ot/registry)" >> $GITHUB_STEP_SUMMARY
          echo "3. Commit with \`git commit -s\` and open one pull request for this version" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See \`docs/REGISTRY.md\` for detailed instructions." >> $GITHUB_STEP_SUMMARY
