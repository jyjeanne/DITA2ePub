name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Unit tests - fast, no DITA-OT required
  unit-tests:
    name: Unit Tests (Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17', '21']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew build -x test --no-daemon

      - name: Run unit tests
        run: |
          ./gradlew test --tests EpubValidatorTest --no-daemon
          ./gradlew test --tests FontEmbeddingTest.testFontCSSTemplateExists --no-daemon
          ./gradlew test --tests FontEmbeddingTest.testFontDocumentationExists --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.os }}-java${{ matrix.java }}
          path: build/reports/tests/test/
          retention-days: 30

      - name: Publish unit test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: build/test-results/test/*.xml
          check_name: Unit Test Results (${{ matrix.os }}, Java ${{ matrix.java }})
        continue-on-error: true

  # Integration tests - requires DITA-OT
  integration-tests:
    name: Integration Tests (Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download DITA-OT (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          wget -q https://github.com/dita-ot/dita-ot/releases/download/4.4.1/dita-ot-4.4.1.zip
          unzip -q dita-ot-4.4.1.zip
          echo "DITA_HOME=${{ github.workspace }}/dita-ot-4.4.1" >> $GITHUB_ENV

      - name: Download DITA-OT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/dita-ot/dita-ot/releases/download/4.4.1/dita-ot-4.4.1.zip" -OutFile "dita-ot-4.4.1.zip"
          Expand-Archive -Path "dita-ot-4.4.1.zip" -DestinationPath "."
          echo "DITA_HOME=${{ github.workspace }}\dita-ot-4.4.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build and install plugin
        shell: bash
        run: |
          ./gradlew build packagePlugin -x test --no-daemon

          # Install the packaged plugin (includes lib/epub-packager.jar required for EPUB packaging)
          cd "$DITA_HOME"
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./bin/dita.bat install "$(cd "$GITHUB_WORKSPACE" && pwd -W)/build/plugin/io.github.jyjeanne.dita2epub.zip"
          else
            ./bin/dita install "$GITHUB_WORKSPACE/build/plugin/io.github.jyjeanne.dita2epub.zip"
          fi

      - name: Verify plugin installation
        shell: bash
        run: |
          cd "$DITA_HOME"
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./bin/dita.bat --plugins | grep epub || echo "Plugin check completed"
          else
            ./bin/dita --plugins | grep epub || echo "Plugin check completed"
          fi

      - name: Run integration tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 30

      - name: Publish integration test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: build/test-results/test/*.xml
          check_name: Integration Test Results (${{ matrix.os }}, Java ${{ matrix.java }})
        continue-on-error: true

      - name: Upload generated EPUBs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-epubs-${{ matrix.os }}
          path: build/**/output/**/*.epub
          retention-days: 7
          if-no-files-found: ignore

  # Build and validate
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/*.jar
          retention-days: 30

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run checkstyle
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon
        continue-on-error: true

      - name: Check code formatting
        run: ./gradlew check --no-daemon
        continue-on-error: true

  # Test summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, build]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Display test summary
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "✅ Completed on multiple platforms and Java versions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "✅ Completed with DITA-OT 4.4.1" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See detailed test reports in artifacts." >> $GITHUB_STEP_SUMMARY
