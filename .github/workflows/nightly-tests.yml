name: Nightly Tests

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  comprehensive-tests:
    name: Comprehensive Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17', '21']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download DITA-OT (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          wget -q https://github.com/dita-ot/dita-ot/releases/download/4.3.5/dita-ot-4.3.5.zip
          unzip -q dita-ot-4.3.5.zip
          echo "DITA_HOME=${{ github.workspace }}/dita-ot-4.3.5" >> $GITHUB_ENV

      - name: Download DITA-OT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/dita-ot/dita-ot/releases/download/4.3.5/dita-ot-4.3.5.zip" -OutFile "dita-ot-4.3.5.zip"
          Expand-Archive -Path "dita-ot-4.3.5.zip" -DestinationPath "."
          echo "DITA_HOME=${{ github.workspace }}\dita-ot-4.3.5" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build and install plugin
        shell: bash
        run: |
          ./gradlew build -x test --no-daemon

          # Copy plugin to DITA-OT
          cp -r . "$DITA_HOME/plugins/io.github.jyjeanne.dita2epub"

          # Integrate plugin
          cd "$DITA_HOME"
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./bin/dita.bat install
          else
            ./bin/dita install
          fi

      - name: Run all tests with coverage
        run: ./gradlew test jacocoTestReport --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/html/
          retention-days: 30

      - name: Test with sample content
        shell: bash
        run: |
          cd "$DITA_HOME"
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./bin/dita.bat --input="${{ github.workspace }}/src/test/resources/dita/sample-bookmap.ditamap" \
                           --format=epub3 \
                           --output="${{ github.workspace }}/build/nightly-output"
          else
            ./bin/dita --input="${{ github.workspace }}/src/test/resources/dita/sample-bookmap.ditamap" \
                       --format=epub3 \
                       --output="${{ github.workspace }}/build/nightly-output"
          fi

      - name: Verify EPUB generation
        shell: bash
        run: |
          if ls ${{ github.workspace }}/build/nightly-output/*.epub 1> /dev/null 2>&1; then
            echo "✅ EPUB generated successfully"
            ls -lh ${{ github.workspace }}/build/nightly-output/*.epub
          else
            echo "❌ No EPUB file found"
            exit 1
          fi

      - name: Upload generated EPUBs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-epubs-${{ matrix.os }}-java${{ matrix.java }}
          path: build/nightly-output/**/*.epub
          retention-days: 7

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [comprehensive-tests]
    if: failure()

    steps:
      - name: Create failure notification
        run: |
          echo "## ⚠️ Nightly Tests Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Some nightly tests have failed. Please check the detailed logs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
