# Project Information
group=io.github.jyjeanne
version=1.0.1

# Gradle Configuration
# Note: org.gradle.java.home should not be set here to allow CI/CD and different
# environments to use their own Java installations. GitHub Actions and local builds
# will automatically detect the correct Java installation.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# JVM Options
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Kotlin
kotlin.code.style=official
